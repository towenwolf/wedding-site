<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <script src="gate.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registry — Diamond & Travis</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preload" href="fonts/VSJohnMuirSans-Light.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face { font-family: "VS John Muir Sans Wide"; src: url("fonts/VSJohnMuirSans-Light.woff2") format("woff2"), url("fonts/VSJohnMuirSans-Light.woff") format("woff"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "VS Outdoor Script"; src: url("fonts/VSOutdoorScript.woff2") format("woff2"), url("fonts/VSOutdoorScript.woff") format("woff"); font-weight: 400; font-display: swap; }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --parchment: #f2ecd9;
      --rust:    #7a4426;
      --ember:   #c9982f;
      --sage:    #3f5c42;
      --dark:    #22281d;
      --muted:   #57544a;
      --light:   #e6e3cf;
      --tan:     #a9895a;
      --pine:    #2f4a3a;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: var(--parchment);
      color: var(--dark);
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0 1.5rem;
      padding: 0 1rem;
      background: rgba(47, 74, 58, 0.96);
      backdrop-filter: blur(6px);
      z-index: 100;
      border-bottom: 2px solid var(--dark);
    }
    nav a {
      font-family: 'VS John Muir Sans Wide', sans-serif;
      font-weight: 600;
      font-size: calc(0.7rem + 1pt);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--parchment);
      text-decoration: none;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      min-height: 44px;
      padding: 0 0.5rem;
    }
    nav a:hover { color: var(--ember); }
    nav a:focus, nav a:focus-visible { outline: none; }
    nav a.current { color: var(--ember); }
    nav .nav-rsvp {
      margin-left: 0.5rem;
    }

    /* SECTIONS */
    section {
      max-width: 780px;
      margin: 0 auto;
      padding: 6rem 2rem;
    }
    .section-label {
      font-family: 'VS John Muir Sans Wide', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 1rem;
    }
    h2 {
      font-family: 'VS John Muir Sans Wide', sans-serif;
      font-size: 2.4rem;
      font-weight: 700;
      margin-bottom: 2rem;
    }
    p { line-height: 1.9; color: var(--muted); margin-bottom: 1rem; font-size: 1.05rem; }

    /* REGISTRY HEADER */
    #registry-header {
      padding: 6rem 2rem 1.5rem;
      text-align: center;
    }
    #registry-header h2 { margin-bottom: 0; }
    #registry { padding-top: 1.5rem; }

    /* REGISTRY */
    #registry { text-align: center; padding-top: 0; }
    .registry-note { padding: 3rem 2rem; }
    .btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.9rem 2.2rem;
      font-family: 'VS John Muir Sans Wide', sans-serif;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--parchment);
      background: var(--rust);
      border-radius: 2px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--pine); }
    .back-link {
      display: inline-block;
      margin-top: 1rem;
      font-family: 'VS John Muir Sans Wide', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--rust);
      text-decoration: none;
    }
    .back-link:hover { color: var(--pine); }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 3rem 2rem;
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 2px solid var(--pine);
      font-style: italic;
    }
    footer span { color: var(--rust); }
  </style>
</head>
<body>

  <nav id="nav">
    <a href="index.html">Home</a>
    <a href="index.html#details">Details</a>
    <a href="story.html">Our Story</a>
    <a href="travel.html">Travel</a>
    <a href="registry.html" class="current">Registry</a>
    <a href="faq.html">FAQ</a>
    <a href="rsvp.html" class="nav-rsvp">RSVP</a>
  </nav>

  <!-- REGISTRY HEADER -->
  <section id="registry-header">
    <p class="section-label">If you'd like</p>
    <h2>Registry</h2>
  </section>

  <!-- REGISTRY -->
  <section id="registry">
    <div class="registry-note">
      <p>Coming soon...</p>
    </div>
    <a href="index.html" class="back-link">&larr; Back to home</a>
  </section>

  <footer>
    Made with <span>♡</span> for Diamond &amp; Travis · May 15, 2027 · Powell Butte, Oregon
  </footer>

</body>
</html>
