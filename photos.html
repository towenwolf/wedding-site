      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
    .hero-when { color: var(--terracotta); }
    #countdown { margin-top: 0.35rem; color: var(--accent); }

    nav {

      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0 1.25rem;
      margin-top: 1.75rem;
    }
    nav a {

      font-weight: 600;
      font-size: calc(0.7rem + 1pt);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      text-underline-offset: 0.5em;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      min-height: 44px;
      padding: 0 0.5rem;
    }
    nav a:hover { opacity: 0.7; }
    nav a:focus, nav a:focus-visible { outline: none; }
    nav a.current { text-decoration: underline; text-decoration-thickness: 1px; }

    /* SECTIONS */
    section {
      max-width: 780px;
      margin: 0 auto;
      padding: 6rem 2rem 4rem;
    }
    .section-label {
      font-family: 'VS John Muir Sans Wide', sans-serif;
      font-size: calc(0.65rem + 1pt);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 1rem;
    }
    h2 {
      font-family: 'VS Outdoor Script', cursive;
      font-size: 2.6rem;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 2rem;
    }
    p { line-height: 1.9; margin-bottom: 1rem; font-size: 1.05rem; }
    p a { color: var(--ink); }

    /* PHOTOS HEADER */
    #photos-header {
      padding: 1rem 2rem 1rem;
      text-align: center;
    }
    #photos-header h2 { margin-bottom: 0; }
    #photos { padding-top: 1rem; }

    /* PHOTOS — engagement gallery */
    #photos { max-width: 1100px; }
    /* Masonry so portrait and landscape photos keep their shape. Without
       script this falls back to CSS columns; the script below lays photos
       out left to right instead, so they read in order across each row. */
    .photo-grid {
      columns: 3 280px;
      column-gap: 1rem;
    }
    .photo-grid.is-laid-out {
      columns: auto;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }
    .photo-col { flex: 1; min-width: 0; }
    .photo-grid img {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: 1rem;
      break-inside: avoid;
    }
    .photo-credit { text-align: center; font-style: italic; margin-top: 0.5rem; color: var(--ink-soft); }

    .back-link {
      display: inline-block;
      margin-top: 1rem;
      font-family: 'VS John Muir Sans Wide', sans-serif;
      font-size: calc(0.7rem + 1pt);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
    }
    .back-link:hover { opacity: 0.7; }

    /* FOOTER */

      font-size: 0.85rem;
      border-top: 2px solid var(--ink);
      font-style: italic;

    }

  <script>
    // Deal photos into columns, each going to the currently shortest column,
    // so the gallery reads left to right in filename order.
    (function () {
      const grid = document.querySelector('.photo-grid');
      const photos = [...grid.querySelectorAll('img')];
      let lastCount = 0;
      function layout() {
        const width = grid.clientWidth;
        const count = width >= 860 ? 3 : width >= 560 ? 2 : 1;
        if (count === lastCount) return;
        lastCount = count;
        const cols = Array.from({ length: count }, () => {
          const col = document.createElement('div');
          col.className = 'photo-col';
          return col;
        });
        const heights = new Array(count).fill(0);
        photos.forEach((img) => {
          const i = heights.indexOf(Math.min(...heights));
          cols[i].appendChild(img);
          heights[i] += img.getAttribute('height') / img.getAttribute('width');
        });
        grid.replaceChildren(...cols);
        grid.classList.add('is-laid-out');
      }
      layout();
      window.addEventListener('resize', layout);
    })();

    function tick() {
      const diff = new Date('2027-05-15T16:00:00') - new Date();
      if (diff <= 0) {
        document.getElementById('countdown').textContent = 'Today\'s the day!';
        return;
      }
      document.getElementById('cd-days').textContent = Math.floor(diff / 86400000);
    }
    tick();
    setInterval(tick, 60000);
  </script>
